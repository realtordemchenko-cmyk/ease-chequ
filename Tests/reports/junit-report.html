<html>
<head>
  <title>API Test Report</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    h1 { color: #333; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .pass { background-color: #d4edda; }
    .fail { background-color: #f8d7da; }
  </style>
</head>
<body>
  <h1>API Test Report</h1>
  <table>
    <tr><th>Test Name</th><th>Status</th><th>Details</th></tr><tr class='pass'><td>AuthCheck</td><td>Passed</td><td></td></tr>
<tr class='pass'><td>HealthCheck</td><td>Passed</td><td></td></tr>
<tr class='fail'><td>InvalidRoute</td><td>Failed</td><td></td></tr>
<tr class='pass'><td>LiveEcho</td><td>Passed</td><td></td></tr>
<tr class='pass'><td>PingTest</td><td>Passed</td><td></td></tr>
<tr class='pass'><td>UserInfo</td><td>Passed</td><td></td></tr>
  </table>
</body>
</html>
